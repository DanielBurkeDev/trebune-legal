<!DOCTYPE html>
<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found · Trebune</title>
<meta name="robots" content="noindex">
<style>
  *{box-sizing:border-box;margin:0;border-radius:0 !important;}
  body{min-height:100vh;display:flex;align-items:center;background:#131313;color:#F2F2F2;
       font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.6;}
  .wrap{max-width:640px;margin:0 auto;padding:48px 16px;width:100%;}
  .label{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#ffb68a;}
  h1{margin-top:14px;font-family:'Space Grotesk',Inter,system-ui,sans-serif;font-weight:700;
     font-size:clamp(44px,10vw,80px);line-height:.92;letter-spacing:-.045em;text-transform:uppercase;}
  p{margin-top:20px;color:#b6b5b5;}
  .links{margin-top:32px;display:flex;flex-wrap:wrap;gap:12px;}
  a{display:inline-block;padding:14px 22px;font-weight:700;font-size:14px;letter-spacing:.12em;
    text-transform:uppercase;text-decoration:none;
    transition:transform .18s cubic-bezier(.2,.7,.2,1),box-shadow .18s cubic-bezier(.2,.7,.2,1),color .15s;}
  a:focus-visible{outline:2px solid #ffb68a;outline-offset:3px;}
  @media (hover:hover){
    .primary:hover{transform:translate(-3px,-3px);box-shadow:3px 3px 0 #ffb68a;}
    .ghost:hover{color:#F2F2F2;transform:translate(-3px,-3px);box-shadow:inset 0 0 0 1px #8a8a8a,3px 3px 0 #353534;}
    a:active{transform:none;box-shadow:none;}
  }
  @keyframes rise{from{opacity:0;transform:translateY(24px);}}
  .wrap>*{animation:rise .7s cubic-bezier(.2,.7,.2,1) backwards;}
  .wrap>:nth-child(2){animation-delay:.1s;}
  .wrap>:nth-child(3){animation-delay:.2s;}
  .wrap>:nth-child(4){animation-delay:.3s;}
  @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important;}}
  .primary{background:#e4700c;color:#fff;}
  .ghost{color:#b6b5b5;box-shadow:inset 0 0 0 1px #353534;}
</style>
</head>
<body>
<div class="wrap">
  <p class="label">404</p>
  <h1>Bailed.<br>Nothing here.</h1>
  <p>This page doesn't exist. It might have moved, or the link's wrong.</p>
  <div class="links">
    <a class="primary" href="/">Trebune home</a>
    <a class="ghost" href="/privacy.html">Privacy</a>
    <a class="ghost" href="/terms.html">Terms</a>
  </div>
</div>
</body>
</html>
