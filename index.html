<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trebune — Legal</title>
<meta name="description" content="Privacy Policy and Terms of Service for the Trebune app.">
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1C1C1C; --surface:#242424; --surface-high:#2E2E2E;
    --text:#EDEDED; --muted:#A8A8A8;
    --primary:#ffb68a; --accent:#E06D06; --teal:#8FB3B5;
  }
  *{margin:0;padding:0;box-sizing:border-box;border-radius:0 !important;}
  body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;line-height:1.65;font-size:16px;
       min-height:100vh;display:flex;align-items:center;justify-content:center;}
  .wrap{max-width:560px;padding:40px 20px;width:100%;}
  .logo{width:44px;height:44px;display:block;margin-bottom:16px;}
  .brand{font-family:'Space Grotesk',sans-serif;font-weight:700;color:var(--primary);font-size:15px;letter-spacing:.08em;text-transform:uppercase;}
  h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:32px;margin:10px 0 8px;}
  p{color:var(--muted);margin-bottom:28px;}
  a.card{display:block;background:var(--surface);padding:18px 22px;margin:12px 0;text-decoration:none;color:var(--text);
         border-left:3px solid var(--accent);}
  a.card:hover{background:var(--surface-high);}
  a.card .title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;color:var(--primary);}
  a.card .sub{font-size:14px;color:var(--muted);margin-top:2px;}
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="logo.png" alt="Trebune logo">
  <div class="brand">Trebune</div>
  <h1>Legal</h1>
  <p>Discover Irish skateparks, spots, shops and sessions.</p>
  <a class="card" href="privacy.html">
    <div class="title">Privacy Policy</div>
    <div class="sub">What data the app collects, why, and your rights.</div>
  </a>
  <a class="card" href="terms.html">
    <div class="title">Terms of Service</div>
    <div class="sub">The rules of using Trebune.</div>
  </a>
</div>
</body>
</html>
